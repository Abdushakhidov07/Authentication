{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static "style.css" %}">
    <title>Document</title>
</head>
<body>
     <h1>Update status {{task.title}}</h1>   
    <form method="post">
        {% csrf_token %}
        <select name="status" id="2">
            {% for key, value in status.items %}
            <option value="{{key}}" {% if key == task.status %}selected disabled{% endif %}>{{value}}</option>
            {% endfor %}
        </select>        
        <button type="submit">Updata status</button>
    </form>
</body>
</html>
